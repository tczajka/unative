name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test-64bit:
    name: Test (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features

  test-32bit:
    name: Test (i686-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - name: Install 32-bit libc
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: cargo test --all-features --target i686-unknown-linux-gnu

  check-16bit:
    name: Check (msp430-none-elf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      # `rand` is omitted: upstream `rand` 0.10 does not compile on 16-bit
      # pointer targets (it uses `Uniform<usize>` unconditionally, but its
      # `UniformUsize` is gated to `target_pointer_width >= 32`).
      - run: cargo build --lib --features num-traits,serde --target msp430-none-elf -Z build-std=core

  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Must match `rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo test --all-features

  minimal-versions:
    name: Minimal versions (MSRV + direct minimal deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Resolve direct dependencies to their minimum versions
        run: cargo +nightly update -Z direct-minimal-versions
      - name: Test with minimum dependency versions
        run: cargo +1.95.0 test --all-features
